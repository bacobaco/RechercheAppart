<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Veille Immobilière & Multi-Recherches Lyon</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #020617;
            --panel-bg: rgba(30, 41, 59, 0.45);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --success: #10b981;
            --info: #0ea5e9;
            --warning: #f59e0b;
            --danger: #ef4444;
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--card-shadow);
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 1.5rem 1.25rem 3rem 1.25rem;
        }

        /* Header Styles */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brand i {
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--accent), var(--info));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand h1 {
            font-size: 1.8rem;
            background: linear-gradient(to right, #ffffff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .brand p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .mode-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            padding: 0.5rem 0.9rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-weight: 500;
        }

        .mode-badge.online {
            border-color: rgba(16, 185, 129, 0.4);
            color: #34d399;
            background: rgba(16, 185, 129, 0.12);
        }

        .mode-badge.local {
            border-color: rgba(99, 102, 241, 0.4);
            color: #a5b4fc;
            background: rgba(99, 102, 241, 0.12);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.65rem 1.25rem;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px var(--accent-glow);
            text-decoration: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: #4f46e5;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
        }

        .btn-sm {
            padding: 0.5rem 0.9rem;
            font-size: 0.82rem;
            border-radius: 10px;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn-sync {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: none;
        }
        .btn-sync:hover {
            background: rgba(16, 185, 129, 0.3);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .btn-scan {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.3);
        }
        .btn-scan:hover {
            background: linear-gradient(135deg, #0284c7, #1d4ed8);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4);
        }

        .last-sync-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            align-self: center;
        }

        /* ==========================================================================
           PROFILES SWITCHER BAR
           ========================================================================== */
        .search-profiles-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.85rem 1.25rem;
            margin-bottom: 2rem;
            gap: 1rem;
            flex-wrap: wrap;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .profiles-tabs {
            display: flex;
            gap: 0.65rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .profile-tab {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.6rem 1.15rem;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.25s ease;
            user-select: none;
        }

        .profile-tab:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .profile-tab.active {
            color: #ffffff;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.35), rgba(14, 165, 233, 0.25));
            border-color: rgba(99, 102, 241, 0.6);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.25);
        }

        .profile-tab i {
            font-size: 1.05rem;
        }

        .profile-tab.active i {
            color: #818cf8;
        }

        .profile-count-pill {
            background: rgba(255, 255, 255, 0.12);
            padding: 0.15rem 0.5rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .profile-tab.active .profile-count-pill {
            background: var(--accent);
            color: #ffffff;
        }

        .profiles-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        /* Description banner of current search */
        .search-info-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.9rem 1.25rem;
            background: rgba(15, 23, 42, 0.35);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .search-info-banner strong {
            color: var(--text-main);
        }

        /* ==========================================================================
           STATS GRID
           ========================================================================== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            padding: 1.25rem;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .stat-card h3 {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.4rem;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
        }

        .stat-card.total { border-left: 4px solid var(--accent); }
        .stat-card.visiter { border-left: 4px solid var(--success); }
        .stat-card.tesla { border-left: 4px solid #38bdf8; }
        .stat-card.box { border-left: 4px solid #a855f7; }
        .stat-card.elec { border-left: 4px solid #10b981; }
        .stat-card.infos { border-left: 4px solid var(--info); }
        .stat-card.attente { border-left: 4px solid var(--warning); }
        .stat-card.nouveau { border-left: 4px solid #38bdf8; }
        .stat-card.elimine { border-left: 4px solid var(--danger); }

        /* ==========================================================================
           CONTROLS & FILTERS
           ========================================================================== */
        .controls-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem;
            margin-bottom: 2rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-filters {
            display: flex;
            gap: 1rem;
            flex-grow: 1;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex-grow: 1;
            min-width: 260px;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            outline: none;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent);
            background: rgba(15, 23, 42, 0.6);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .filter-select {
            padding: 0.75rem 1.25rem;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            outline: none;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-select:focus {
            border-color: var(--accent);
        }

        .filter-select option {
            background: var(--bg-color);
            color: var(--text-main);
        }

        /* ==========================================================================
           LISTINGS GRID & CARDS
           ========================================================================== */
        .listings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 1.5rem;
        }

        .listing-card {
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            position: relative;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            border-top: 3px solid transparent;
        }

        .listing-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 16px 36px 0 rgba(0, 0, 0, 0.45);
        }

        .listing-card.status-nouveau { border-top-color: #38bdf8; }
        .listing-card.status-visiter { border-top-color: var(--success); }
        .listing-card.status-infos { border-top-color: var(--info); }
        .listing-card.status-attente { border-top-color: var(--warning); }
        .listing-card.status-loue { border-top-color: var(--danger); opacity: 0.65; }
        .listing-card.status-elimine { border-top-color: var(--danger); opacity: 0.65; }

        /* Reorder Controls */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.85rem;
            gap: 0.75rem;
        }

        .card-header-left {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            flex: 1;
        }

        .card-reorder-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.15rem;
            margin-top: 0.1rem;
        }

        .btn-reorder {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.15rem 0.3rem;
            border-radius: 4px;
            font-size: 0.75rem;
            transition: all 0.2s;
        }

        .btn-reorder:hover:not(:disabled) {
            color: var(--accent);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-reorder:disabled {
            opacity: 0.25;
            cursor: default;
        }

        .card-drag-handle {
            color: rgba(255, 255, 255, 0.2);
            cursor: grab;
            font-size: 0.8rem;
            padding: 0 0.2rem;
        }

        .card-drag-handle:hover {
            color: var(--text-muted);
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.35;
        }

        .card-price {
            font-size: 1.35rem;
            font-weight: 700;
            color: #38bdf8;
            font-family: 'Outfit', sans-serif;
            white-space: nowrap;
        }

        .card-meta-tags {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .tag {
            font-size: 0.72rem;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .tag-source {
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .tag-quartier {
            background: rgba(14, 165, 233, 0.15);
            color: #7dd3fc;
            border: 1px solid rgba(14, 165, 233, 0.3);
        }

        .tag-date {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .tag-distance {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
            font-weight: 600;
        }

        .tag-tesla {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            font-weight: 600;
        }

        .tag-elec {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
            font-weight: 600;
        }

        .tag-box {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        /* Specs Grid */
        .card-specs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            padding: 0.85rem;
            background: rgba(15, 23, 42, 0.35);
            border-radius: 10px;
            margin-bottom: 1rem;
            border: 1px solid var(--border-color);
        }

        .spec-item {
            text-align: center;
        }

        .spec-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .spec-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Address & Maps */
        .card-address {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-address a {
            color: #38bdf8;
            text-decoration: none;
            transition: color 0.2s;
        }

        .card-address a:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }

        /* Walking itinerary button for parking */
        .card-itinerary-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 0.9rem;
            border-radius: 8px;
            background: rgba(14, 165, 233, 0.12);
            border: 1px solid rgba(14, 165, 233, 0.3);
            color: #38bdf8;
            font-size: 0.82rem;
            font-weight: 500;
            text-decoration: none;
            margin-bottom: 1rem;
            transition: all 0.2s ease;
        }

        .card-itinerary-btn:hover {
            background: rgba(14, 165, 233, 0.25);
            color: #7dd3fc;
            transform: translateY(-1px);
        }

        /* Advantages & Disadvantages */
        .card-details-box {
            background: rgba(15, 23, 42, 0.25);
            border-radius: 8px;
            padding: 0.65rem 0.85rem;
            margin-bottom: 1rem;
            font-size: 0.8rem;
            border: 1px solid var(--border-color);
        }

        .detail-line {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 0.35rem;
            line-height: 1.4;
        }

        .detail-line:last-child {
            margin-bottom: 0;
        }

        .detail-line.plus { color: #86efac; }
        .detail-line.minus { color: #fca5a5; }

        /* Notes & Annotations styling */
        .card-notes {
            margin-top: auto;
            background: rgba(15, 23, 42, 0.2);
            border-top: 1px solid var(--border-color);
            padding-top: 0.85rem;
            margin-bottom: 1rem;
        }

        .notes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.35rem;
        }

        .notes-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .save-indicator {
            font-size: 0.7rem;
            color: var(--success);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .save-indicator.active {
            opacity: 1;
        }

        .notes-textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            padding: 0.5rem;
            font-family: inherit;
            font-size: 0.82rem;
            resize: vertical;
            min-height: 70px;
            outline: none;
            transition: all 0.3s ease;
        }

        .notes-textarea:focus {
            border-color: var(--accent);
            background: rgba(15, 23, 42, 0.6);
        }

        /* Card Actions and dropdowns */
        .card-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .status-dropdown {
            flex-grow: 1;
            padding: 0.65rem;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .status-dropdown:focus {
            border-color: var(--accent);
        }

        .status-dropdown option {
            background: var(--bg-color);
            color: var(--text-main);
        }

        .card-btn {
            background: rgba(99, 102, 241, 0.12);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.25);
            padding: 0.65rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .card-btn:hover {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        /* Empty state styling */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--accent), var(--info));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        /* ==========================================================================
           MODALS
           ========================================================================== */
        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-content {
            background: rgba(30, 41, 59, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .modal-header h3 {
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-main);
        }

        .btn-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.75rem;
            cursor: pointer;
            line-height: 1;
        }
        .btn-close:hover {
            color: var(--danger);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            font-weight: 500;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.65rem 0.85rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--accent);
        }

        .modal-footer {
            margin-top: 1.5rem;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }

        /* Toasts */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            pointer-events: none;
        }

        .toast {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.85rem 1.25rem;
            color: var(--text-main);
            font-size: 0.88rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            pointer-events: auto;
            animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .toast-success { border-left: 4px solid var(--success); }
        .toast-danger { border-left: 4px solid var(--danger); }
        .toast-info { border-left: 4px solid var(--info); }

        @keyframes toastIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes toastOut {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(20px); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Dashboard Header -->
        <header class="glass-panel">
            <div class="brand">
                <i class="fa-solid fa-radar" id="brand-icon"></i>
                <div>
                    <h1 id="brand-title">Veille Immobilière & Multi-Recherches</h1>
                    <p id="brand-subtitle">Recherche autonome d'appartements et de parkings à Lyon</p>
                </div>
            </div>
            
            <div class="header-actions">
                <div id="mode-badge" class="mode-badge">
                    <i class="fa-solid fa-spinner fa-spin"></i> <span id="mode-text">Connexion...</span>
                </div>
                <span class="last-sync-time" id="last-sync-time"></span>
                <button class="btn btn-primary" onclick="openAddModal()" title="Ajouter une annonce manuellement">
                    <i class="fa-solid fa-plus"></i> Ajouter une annonce
                </button>
                <button class="btn btn-sync" id="btn-sync-github" onclick="syncToGitHub()" style="display:none;" title="Forcer la synchronisation vers GitHub Pages">
                    <i class="fa-brands fa-github"></i> Sync GitHub
                </button>
                <button class="btn btn-secondary" onclick="forceRefresh()" title="Actualiser les annonces">
                    <i class="fa-solid fa-rotate-right" id="refresh-icon"></i> Actualiser
                </button>
            </div>
        </header>

        <!-- Search Profiles Switcher Bar -->
        <div class="search-profiles-bar glass-panel">
            <div class="profiles-tabs" id="profiles-tabs">
                <!-- Dynamically populated profile tabs -->
            </div>
            <div class="profiles-actions">
                <button class="btn btn-sm btn-scan" id="btn-run-scan" onclick="triggerScanCurrentSearch()" title="Lancer le scan immédiat pour cette recherche">
                    <i class="fa-solid fa-play"></i> Lancer le Scan
                </button>
                <button class="btn btn-sm btn-secondary" onclick="openSearchSettingsModal()" title="Consulter et modifier les critères de la recherche">
                    <i class="fa-solid fa-sliders"></i> Critères
                </button>
                <button class="btn btn-sm btn-secondary" onclick="openNewSearchModal()" title="Créer un nouveau profil de recherche">
                    <i class="fa-solid fa-plus"></i> Nouvelle Recherche
                </button>
            </div>
        </div>

        <!-- Current Search Description Banner -->
        <div class="search-info-banner" id="search-info-banner">
            <div>
                <i class="fa-solid fa-circle-info" style="color: var(--accent); margin-right: 0.4rem;"></i>
                <span id="current-search-desc">Chargement des critères...</span>
            </div>
            <div id="current-search-target-address" style="font-size: 0.8rem; color: #7dd3fc;"></div>
        </div>

        <!-- Dashboard Stats Grid -->
        <div class="stats-grid" id="stats-grid">
            <!-- Dynamically populated depending on search type (appartement vs parking) -->
        </div>

        <!-- Filters and controls -->
        <div class="glass-panel controls-panel">
            <div class="search-filters">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Rechercher par mot-clé (titre, quartier, adresse...)" oninput="filterAndRender()">
                </div>
                <select class="filter-select" id="filter-source" onchange="filterAndRender()">
                    <option value="">Toutes les sources</option>
                </select>
                <select class="filter-select" id="filter-quartier" onchange="filterAndRender()">
                    <option value="">Tous les quartiers</option>
                </select>
                <select class="filter-select" id="filter-statut" onchange="filterAndRender()">
                    <option value="">Tous les statuts</option>
                    <option value="Nouveau">Nouveau</option>
                    <option value="À visiter">À visiter</option>
                    <option value="Demande d'infos">Demande d'infos</option>
                    <option value="En attente">En attente</option>
                    <option value="Retenu">Retenu</option>
                    <option value="Éliminer">Éliminer</option>
                    <option value="Déjà loué">Déjà loué</option>
                </select>
            </div>
            
            <button class="btn btn-secondary" id="toggle-eliminated-btn" onclick="toggleShowEliminated()">
                <i class="fa-solid fa-eye"></i> Afficher les éliminés
            </button>
        </div>

        <!-- Grid of listings -->
        <div class="listings-grid" id="listings-grid">
            <div class="empty-state">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <h3>Chargement des annonces...</h3>
                <p>Connexion aux données de la recherche.</p>
            </div>
        </div>
    </div>

    <!-- Modal Ajouter une annonce -->
    <div id="add-modal" class="modal-backdrop" onclick="if(event.target === this) closeAddModal()">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3><i class="fa-solid fa-plus-circle" style="color: var(--accent);"></i> <span id="add-modal-title">Ajouter une annonce</span></h3>
                <button type="button" class="btn-close" onclick="closeAddModal()">&times;</button>
            </div>
            <form id="add-form" onsubmit="submitAddModal(event)">
                <div class="form-grid">
                    <div class="form-group full">
                        <label for="add-titre">Titre de l'annonce *</label>
                        <input type="text" id="add-titre" required placeholder="ex: Box fermé sécurisé Rue du Lac">
                    </div>
                    <div class="form-group full">
                        <label for="add-lien">Lien web de l'annonce (URL)</label>
                        <input type="url" id="add-lien" placeholder="https://www.bienici.com/... ou leboncoin.fr/...">
                    </div>
                    <div class="form-group">
                        <label for="add-prix">Loyer mensuel (€)</label>
                        <input type="text" id="add-prix" placeholder="ex: 90 €">
                    </div>
                    <div class="form-group" id="field-surface-group">
                        <label for="add-surface">Surface (m²)</label>
                        <input type="number" step="0.1" id="add-surface" placeholder="ex: 15">
                    </div>
                    <div class="form-group" id="field-type-parking-group" style="display:none;">
                        <label for="add-type-parking">Type de stationnement</label>
                        <select id="add-type-parking">
                            <option value="Box fermé">Box fermé</option>
                            <option value="Place en sous-sol">Place en sous-sol</option>
                            <option value="Place extérieure">Place extérieure</option>
                        </select>
                    </div>
                    <div class="form-group" id="field-distance-group" style="display:none;">
                        <label for="add-distance">Distance / Temps à pied</label>
                        <input type="text" id="add-distance" placeholder="ex: 250 m (~3 min à pied)">
                    </div>
                    <div class="form-group">
                        <label for="add-quartier">Quartier</label>
                        <input type="text" id="add-quartier" placeholder="ex: Lyon 3e, Garibaldi">
                    </div>
                    <div class="form-group full">
                        <label for="add-adresse">Adresse / Rue</label>
                        <input type="text" id="add-adresse" placeholder="ex: 28 Rue des Rancy, 69003 Lyon">
                    </div>
                    <div class="form-group">
                        <label for="add-statut">Statut initial</label>
                        <select id="add-statut" class="status-dropdown">
                            <option value="Nouveau" selected>Nouveau</option>
                            <option value="À visiter">À visiter</option>
                            <option value="Demande d'infos">Demande d'infos</option>
                            <option value="En attente">En attente</option>
                            <option value="Retenu">Retenu</option>
                            <option value="Déjà loué">Déjà loué</option>
                            <option value="Éliminer">Éliminer</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="add-avantages">Avantages clés</label>
                        <input type="text" id="add-avantages" placeholder="ex: Box fermé, bip, électricité, très proche">
                    </div>
                    <div class="form-group full">
                        <label for="add-notes">Notes &amp; Observations</label>
                        <textarea id="add-notes" class="notes-textarea" placeholder="Remarques, contact agence, disponibilité..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeAddModal()">Annuler</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Enregistrer et Synchroniser</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Paramètres de la recherche -->
    <div id="settings-modal" class="modal-backdrop" onclick="if(event.target === this) closeSearchSettingsModal()">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3><i class="fa-solid fa-sliders" style="color: var(--accent);"></i> Paramètres de la Recherche</h3>
                <button type="button" class="btn-close" onclick="closeSearchSettingsModal()">&times;</button>
            </div>
            <form id="settings-form" onsubmit="submitSearchSettings(event)">
                <div class="form-grid">
                    <div class="form-group full">
                        <label for="cfg-name">Nom de la recherche</label>
                        <input type="text" id="cfg-name" required>
                    </div>
                    <div class="form-group full">
                        <label for="cfg-desc">Description</label>
                        <textarea id="cfg-desc" style="min-height: 60px;"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="cfg-budget-max">Budget Maximum (€/mois)</label>
                        <input type="number" id="cfg-budget-max">
                    </div>
                    <div class="form-group" id="cfg-surface-group">
                        <label for="cfg-surface-min">Surface minimum (m²)</label>
                        <input type="number" id="cfg-surface-min">
                    </div>
                    <div class="form-group full" id="cfg-address-group">
                        <label for="cfg-target-address">Adresse cible</label>
                        <input type="text" id="cfg-target-address" placeholder="ex: 56 avenue Félix Faure, 69003 Lyon">
                    </div>
                    <div class="form-group" id="cfg-radius-group">
                        <label for="cfg-radius">Rayon de recherche (mètres)</label>
                        <input type="number" id="cfg-radius" placeholder="ex: 650">
                    </div>
                    <div class="form-group">
                        <label for="cfg-enabled">Statut du scan automatique</label>
                        <select id="cfg-enabled">
                            <option value="true">Actif (Inclus dans les scans)</option>
                            <option value="false">Désactivé (En pause)</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeSearchSettingsModal()">Fermer</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Enregistrer les Critères</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Nouvelle Recherche -->
    <div id="new-search-modal" class="modal-backdrop" onclick="if(event.target === this) closeNewSearchModal()">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3><i class="fa-solid fa-plus-circle" style="color: var(--accent);"></i> Créer une nouvelle recherche</h3>
                <button type="button" class="btn-close" onclick="closeNewSearchModal()">&times;</button>
            </div>
            <form id="new-search-form" onsubmit="submitNewSearch(event)">
                <div class="form-grid">
                    <div class="form-group full">
                        <label for="new-search-name">Nom de la recherche *</label>
                        <input type="text" id="new-search-name" required placeholder="ex: Recherche Parking Part-Dieu ou Achat Studio Lyon 2">
                    </div>
                    <div class="form-group">
                        <label for="new-search-type">Type de bien / objet</label>
                        <select id="new-search-type" onchange="toggleNewSearchFields()">
                            <option value="appartement">Appartement</option>
                            <option value="parking">Parking / Garage / Box</option>
                            <option value="objet">Objet / Véhicule / Autre</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="new-search-budget">Budget Max (€)</label>
                        <input type="number" id="new-search-budget" placeholder="ex: 150">
                    </div>
                    <div class="form-group full" id="new-search-addr-row">
                        <label for="new-search-address">Adresse cible / Secteur</label>
                        <input type="text" id="new-search-address" placeholder="ex: 56 avenue Félix Faure, 69003 Lyon">
                    </div>
                    <div class="form-group full">
                        <label for="new-search-desc">Description &amp; Critères clés</label>
                        <textarea id="new-search-desc" style="min-height: 60px;" placeholder="Explications, contraintes spécifiques..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeNewSearchModal()">Annuler</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Créer la Recherche</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let searchesConfig = null;
        let currentSearchId = "meuble_1";
        let allListings = [];
        let showEliminated = false;
        let isLocalServer = false;

        // On Load initialization
        window.addEventListener('DOMContentLoaded', async () => {
            await initSearches();
            
            // Polling: local server every 8s, static every 60s
            setInterval(() => {
                if (isLocalServer) fetchData();
            }, 8000);
            setInterval(() => {
                if (!isLocalServer) fetchData();
            }, 60000);
        });

        // Initialize Searches Configuration
        async function initSearches() {
            try {
                // 1. Try /api/searches
                let cfg = null;
                try {
                    const res = await fetch('/api/searches', { cache: 'no-store' });
                    if (res.ok) {
                        cfg = await res.json();
                        isLocalServer = true;
                    }
                } catch (e) {}

                // 2. Fallback to ./searches.json
                if (!cfg) {
                    try {
                        const staticRes = await fetch('./searches.json?t=' + Date.now(), { cache: 'no-store' });
                        if (staticRes.ok) {
                            cfg = await staticRes.json();
                        }
                    } catch (e) {}
                }

                if (!cfg) {
                    cfg = {
                        active_search_id: "meuble_1",
                        searches: [
                            {
                                id: "meuble_1",
                                name: "Recherche Meublé 1",
                                type: "appartement",
                                icon: "fa-house",
                                enabled: true,
                                data_file: "data.json",
                                description: "Appartements meublés de standing Lyon"
                            },
                            {
                                id: "parking_felix_faure",
                                name: "Recherche Parking 56 rue Félix Faure Lyon",
                                type: "parking",
                                icon: "fa-square-parking",
                                enabled: true,
                                data_file: "data_parking_felix_faure.json",
                                description: "Parking / box pour Tesla autour du 56 Félix Faure Lyon 3"
                            }
                        ]
                    };
                }

                searchesConfig = cfg;
                
                // Get URL parameter ?search=... or saved preference or default
                const urlParams = new URLSearchParams(window.location.search);
                const urlSearchId = urlParams.get('search') || urlParams.get('id');
                if (urlSearchId && searchesConfig.searches.some(s => s.id === urlSearchId)) {
                    currentSearchId = urlSearchId;
                } else if (searchesConfig.active_search_id) {
                    currentSearchId = searchesConfig.active_search_id;
                } else {
                    currentSearchId = searchesConfig.searches[0]?.id || "meuble_1";
                }

                renderProfileTabs();
                await fetchData(true);
            } catch (err) {
                console.error("Erreur initialisation searches:", err);
                await fetchData(true);
            }
        }

        // Render Profile Tabs in the Top Bar
        function renderProfileTabs() {
            const tabsContainer = document.getElementById('profiles-tabs');
            if (!tabsContainer || !searchesConfig) return;

            tabsContainer.innerHTML = '';
            searchesConfig.searches.forEach(search => {
                const isActive = (search.id === currentSearchId);
                const tab = document.createElement('div');
                tab.className = `profile-tab ${isActive ? 'active' : ''}`;
                
                const iconClass = search.icon || (search.type === 'parking' ? 'fa-square-parking' : 'fa-house');
                
                tab.innerHTML = `
                    <i class="fa-solid ${iconClass}"></i>
                    <span>${search.name}</span>
                    <span class="profile-count-pill" id="tab-count-${search.id}">...</span>
                `;
                tab.onclick = () => switchSearchProfile(search.id);
                tabsContainer.appendChild(tab);
            });

            // Update Header & Banner info for current search
            updateSearchHeaderInfo();
        }

        // Switch to a different Search Profile
        async function switchSearchProfile(searchId) {
            if (currentSearchId === searchId) return;
            currentSearchId = searchId;
            
            // Update URL without full reload
            const url = new URL(window.location);
            url.searchParams.set('search', searchId);
            window.history.replaceState({}, '', url);

            renderProfileTabs();
            await fetchData(true);
        }

        // Update Header & Banner Info based on selected profile
        function updateSearchHeaderInfo() {
            const currentProfile = searchesConfig?.searches.find(s => s.id === currentSearchId) || {};
            const brandTitle = document.getElementById('brand-title');
            const brandSubtitle = document.getElementById('brand-subtitle');
            const brandIcon = document.getElementById('brand-icon');
            const descEl = document.getElementById('current-search-desc');
            const targetAddrEl = document.getElementById('current-search-target-address');

            if (currentProfile.type === 'parking') {
                brandTitle.textContent = currentProfile.name || "Veille Parking Lyon";
                brandSubtitle.textContent = "Parkings, garages et box sécurisés pour Tesla à proximité du 56 Félix Faure";
                brandIcon.className = "fa-solid fa-square-parking";
                if (targetAddrEl) targetAddrEl.innerHTML = `<i class="fa-solid fa-location-crosshairs"></i> Cible : <strong>56 av. Félix Faure (Lyon 3e)</strong> | Rayon : ${currentProfile.params?.rayon_metres || 650}m`;
            } else {
                brandTitle.textContent = currentProfile.name || "Chasseur d'Appartement";
                brandSubtitle.textContent = "Suivi de recherche d'appartements à Lyon (Damien & Isabelle)";
                brandIcon.className = "fa-solid fa-house-chimney-window";
                if (targetAddrEl) targetAddrEl.innerHTML = `<i class="fa-solid fa-filter"></i> Secteurs : <strong>Lyon 1, 2, 3, 5 Vieux Lyon, 6</strong> | Ascenseur + Clim`;
            }

            if (descEl) {
                descEl.textContent = currentProfile.description || "Recherche configurée dans searches.json";
            }
        }

        // Fetch listings for current profile
        async function fetchData(force = false) {
            try {
                const activeEl = document.activeElement;
                const isEditing = !force && activeEl && (
                    activeEl.id === 'search-input' ||
                    activeEl.id === 'filter-source' ||
                    activeEl.id === 'filter-quartier' ||
                    activeEl.id === 'filter-statut' ||
                    activeEl.classList.contains('notes-textarea') ||
                    activeEl.classList.contains('status-dropdown')
                );
                if (isEditing) return;

                const currentProfile = searchesConfig?.searches.find(s => s.id === currentSearchId) || {};
                const dataFile = currentProfile.data_file || "data.json";

                let dataFetched = null;

                // 1. Try local server API with ?search=...
                try {
                    const apiRes = await fetch(`/api/data?search=${encodeURIComponent(currentSearchId)}`, { cache: 'no-store' });
                    if (apiRes.ok) {
                        dataFetched = await apiRes.json();
                        isLocalServer = true;
                    }
                } catch (e) {}

                // 2. Fallback to static file (GitHub Pages)
                if (!dataFetched) {
                    isLocalServer = false;
                    const staticRes = await fetch(`./${dataFile}?t=` + Date.now(), { cache: 'no-store' });
                    if (staticRes.ok) {
                        dataFetched = await staticRes.json();
                    } else {
                        // Fallback to data.json
                        const fallbackRes = await fetch('./data.json?t=' + Date.now(), { cache: 'no-store' });
                        if (fallbackRes.ok) dataFetched = await fallbackRes.json();
                    }
                }

                allListings = dataFetched || [];

                // Update count in tab
                const tabCount = document.getElementById(`tab-count-${currentSearchId}`);
                if (tabCount) tabCount.textContent = allListings.length;

                // Update server connection badge
                const badge = document.getElementById('mode-badge');
                const modeText = document.getElementById('mode-text');
                const syncBtn = document.getElementById('btn-sync-github');
                const lastSyncEl = document.getElementById('last-sync-time');

                const now = new Date();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                if (lastSyncEl) lastSyncEl.textContent = `Mis à jour à ${timeStr}`;

                if (badge && modeText) {
                    if (isLocalServer) {
                        badge.className = "mode-badge local";
                        modeText.innerHTML = '<i class="fa-solid fa-server"></i> Serveur local actif';
                        if (syncBtn) syncBtn.style.display = "inline-flex";
                    } else {
                        badge.className = "mode-badge online";
                        modeText.innerHTML = '<i class="fa-solid fa-globe"></i> En ligne (GitHub Pages)';
                        if (syncBtn) syncBtn.style.display = "none";
                    }
                }

                populateFilters();
                updateStats();
                filterAndRender();
            } catch (err) {
                console.error("Error fetching listings:", err);
                const grid = document.getElementById('listings-grid');

        // Populate search dropdowns (Sources & Quartiers) dynamically
        function populateFilters() {
            const sourceSelect = document.getElementById('filter-source');
            const quartierSelect = document.getElementById('filter-quartier');
            
            const currentSource = sourceSelect.value;
            const currentQuartier = quartierSelect.value;
            
            const sources = new Set();
            const quartiers = new Set();
            
            allListings.forEach(item => {
                if (item.source) sources.add(item.source);
                if (item.quartier) {
                    const qName = item.quartier.split(',')[0].trim();
                    quartiers.add(qName);
                }
            });
            
            sourceSelect.innerHTML = '<option value="">Toutes les sources</option>';
            Array.from(sources).sort().forEach(src => {
                const opt = document.createElement('option');
                opt.value = src;
                opt.textContent = src;
                sourceSelect.appendChild(opt);
            });
            sourceSelect.value = currentSource;
            
            quartierSelect.innerHTML = '<option value="">Tous les quartiers</option>';
            Array.from(quartiers).sort().forEach(q => {
                const opt = document.createElement('option');
                opt.value = q;
                opt.textContent = q;
                quartierSelect.appendChild(opt);
            });
            quartierSelect.value = currentQuartier;
        }

            const infos = allListings.filter(i => i.statut === "Demande d'infos").length;
            const attente = allListings.filter(i => i.statut === "En attente").length;
            const nouveau = allListings.filter(i => i.statut === "Nouveau").length;
            const elimines = allListings.filter(i => i.statut === "Éliminer" || i.statut === "Déjà loué").length;

            if (isParking) {
                const closeCount = allListings.filter(i => (i.distance_metres && i.distance_metres <= 350)).length;

                const elecCount = allListings.filter(i => (i.prise_electrique && i.prise_electrique.includes("Borne")) || (i.avantages && i.avantages.toLowerCase().includes("prise"))).length;

        // Trigger scan for the active search profile
        async function triggerScanCurrentSearch() {
            const btn = document.getElementById('btn-run-scan');
            if (!btn) return;
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Scan en cours...';

            if (isLocalServer) {
                try {
                    const res = await fetch('/api/run_agent', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ search: currentSearchId })
                    });
                    if (res.ok) {
                        showToast(`Scan de '${currentSearchId}' lancé avec succès en tâche de fond !`, "success");
                    } else if (res.status === 409) {
                        showToast("Un scan est déjà en cours d'exécution.", "info");
                    } else {
                        showToast("Erreur lors du déclenchement du scan.", "danger");
                    }
                } catch (e) {
                    showToast("Erreur réseau vers le serveur local", "danger");
                }
            } else {
                showToast("Le scan autonome s'exécute sur le serveur local via : python agent.py", "info");
            }

            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }, 3000);
        }

        // Save updated notes
        let saveTimeouts = {};
        function saveNotes(url, notes, indicatorElId) {
            const indicator = document.getElementById(indicatorElId);
            if (indicator) {
                indicator.textContent = "Sauvegarde...";
                indicator.classList.add('active');
            }
            
            if (saveTimeouts[url]) clearTimeout(saveTimeouts[url]);
            
            saveTimeouts[url] = setTimeout(async () => {
                let saved = false;
                if (isLocalServer) {
                    try {
                        const response = await fetch('/api/update_notes', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ search: currentSearchId, lien_annonce: url, notes: notes })
                        });
                        if (response.ok) {
                            saved = true;
                            if (indicator) indicator.textContent = "Enregistré & Sync";
                            showToast("Notes sauvegardées et synchronisées !", "success");
                        }
                    } catch (err) {
                        console.warn("API save error:", err);
                    }
                }

                if (!saved && indicator) {
                    indicator.textContent = isLocalServer ? "Erreur serveur" : "Session (en ligne)";
                }

                if (indicator) setTimeout(() => indicator.classList.remove('active'), 2500);
                const item = allListings.find(i => i.lien_annonce === url);
                if (item) item.notes = notes;
            }, 1000);
        }

        // Save updated status
        async function saveStatus(url, newStatus) {
            let saved = false;
            if (isLocalServer) {
                try {
                    const response = await fetch('/api/update_status', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ search: currentSearchId, lien_annonce: url, statut: newStatus })
                    });
                    if (response.ok) {
                        saved = true;
                        showToast(`Statut '${newStatus}' enregistré et synchronisé !`, "success");
                    }
                } catch (err) {
                    console.warn("Error saving status to server:", err);
                }
            }

            if (!saved && !isLocalServer) {
                showToast(`Statut '${newStatus}' mis à jour pour cette session.`, "info");
            }

            const item = allListings.find(i => i.lien_annonce === url);
            if (item) item.statut = newStatus;
            updateStats();
            filterAndRender();
        }

        // Helper: retrieve listings matching current filters
        function getFilteredListings() {
            const searchInput = document.getElementById('search-input');
            const searchVal = searchInput ? searchInput.value.toLowerCase().trim() : "";
            const sourceSelect = document.getElementById('filter-source');
            const sourceVal = sourceSelect ? sourceSelect.value : "";
            const quartierSelect = document.getElementById('filter-quartier');
            const quartierVal = quartierSelect ? quartierSelect.value : "";
            const statutSelect = document.getElementById('filter-statut');
            const statutVal = statutSelect ? statutSelect.value : "";
            
            return allListings.filter(item => {
                const isEliminated = (item.statut === "Éliminer" || item.statut === "Déjà loué");
                if (isEliminated && !showEliminated) return false;
                if (statutVal && item.statut !== statutVal) return false;
                if (sourceVal && item.source !== sourceVal) return false;
                
                if (quartierVal) {
                    const qName = item.quartier ? item.quartier.split(',')[0].trim() : "";
                    if (qName !== quartierVal) return false;
                }
                
                if (searchVal) {
                    const text = (item.titre + " " + (item.description || "") + " " + (item.adresse_estimee || "") + " " + (item.quartier || "") + " " + (item.type_parking || "") + " " + (item.source || "")).toLowerCase();
                    if (!text.includes(searchVal)) return false;
                }
                
                return true;
            });
        }

        // Show non-blocking toast notifications
        function showToast(message, type = "success") {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                container.className = 'toast-container';
                document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-circle-info';
            toast.innerHTML = `<i class="fa-solid ${icon}" style="color: ${type === 'success' ? 'var(--success)' : 'var(--info)'}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'toastOut 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // Reorder listing by clicking Move Up / Move Down buttons
        function reorderListing(url, direction) {
            const filtered = getFilteredListings();
            const visIdx = filtered.findIndex(i => i.lien_annonce === url);
            if (visIdx === -1) return;

            const targetVisIdx = visIdx + direction;
            if (targetVisIdx < 0 || targetVisIdx >= filtered.length) return;

            const targetItem = filtered[targetVisIdx];
            const currentIdx = allListings.findIndex(i => i.lien_annonce === url);
            if (currentIdx === -1) return;

            const [draggedItem] = allListings.splice(currentIdx, 1);
            const targetIdxInAll = allListings.findIndex(i => i.lien_annonce === targetItem.lien_annonce);

            if (targetIdxInAll === -1) {
                allListings.push(draggedItem);
            } else {
                const insertIdx = (direction > 0) ? targetIdxInAll + 1 : targetIdxInAll;
                allListings.splice(insertIdx, 0, draggedItem);
            }

            filterAndRender();
            persistOrder();
        }

                lien_annonce: lien || ("https://recherche.local/" + Date.now()),
                prix,
                surface: parseFloat(surface) || 0,
                quartier,
                adresse_estimee: adresse,
                source: "Manuel",
                statut,
                avantages,
                notes: notes || (avantages ? `Avantages: ${avantages}` : "")
            };

            if (isParking) {
                payload.type_parking = document.getElementById('add-type-parking').value;
                payload.distance_cible = document.getElementById('add-distance').value || "Proximité 56 Félix Faure";
            }

            if (isLocalServer) {
                try {
                    const res = await fetch('/api/add_listing', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (res.ok) {
                        closeAddModal();
                        document.getElementById('add-form').reset();
                        showToast(`Annonce '${titre}' ajoutée avec succès !`, "success");
                        await fetchData(true);
                        return;
                    }
                } catch (err) {}
            }

            closeAddModal();
            allListings.unshift(payload);
            updateStats();
            filterAndRender();
            showToast("Annonce ajoutée pour votre session.", "info");
        }

        // Settings Modal
        function openSearchSettingsModal() {
            const profile = searchesConfig?.searches.find(s => s.id === currentSearchId);
            if (!profile) return;

            document.getElementById('cfg-name').value = profile.name || "";
            document.getElementById('cfg-desc').value = profile.description || "";
            document.getElementById('cfg-budget-max').value = profile.params?.budget_max || 150;
            document.getElementById('cfg-surface-min').value = profile.params?.surface_min || 70;
            document.getElementById('cfg-target-address').value = profile.params?.adresse_cible || "";
            document.getElementById('cfg-radius').value = profile.params?.rayon_metres || 650;
            document.getElementById('cfg-enabled').value = profile.enabled ? "true" : "false";

            const isParking = profile.type === 'parking';
            document.getElementById('cfg-surface-group').style.display = isParking ? "none" : "block";
            document.getElementById('cfg-address-group').style.display = isParking ? "block" : "none";
            document.getElementById('cfg-radius-group').style.display = isParking ? "block" : "none";

            document.getElementById('settings-modal').classList.add('open');
        }

        function closeSearchSettingsModal() {
            document.getElementById('settings-modal').classList.remove('open');
        }

        async function submitSearchSettings(e) {
            e.preventDefault();
            const profile = searchesConfig?.searches.find(s => s.id === currentSearchId);
            if (!profile) return;

            profile.name = document.getElementById('cfg-name').value.trim();
            profile.description = document.getElementById('cfg-desc').value.trim();
            profile.enabled = (document.getElementById('cfg-enabled').value === "true");

            if (!profile.params) profile.params = {};
            profile.params.budget_max = parseFloat(document.getElementById('cfg-budget-max').value) || profile.params.budget_max;
            
            if (profile.type === 'parking') {
                profile.params.adresse_cible = document.getElementById('cfg-target-address').value.trim();
                profile.params.rayon_metres = parseInt(document.getElementById('cfg-radius').value, 10) || 650;
            } else {
                profile.params.surface_min = parseFloat(document.getElementById('cfg-surface-min').value) || 70;
            }

            if (isLocalServer) {
                try {
                    await fetch('/api/searches', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(searchesConfig)
                    });
                    showToast("Paramètres enregistrés et synchronisés !", "success");
                } catch (err) {}
            }

            closeSearchSettingsModal();
            renderProfileTabs();
        }

        // New Search Modal
        function openNewSearchModal() {
            document.getElementById('new-search-modal').classList.add('open');
            toggleNewSearchFields();
        }

        function closeNewSearchModal() {
            document.getElementById('new-search-modal').classList.remove('open');
        }

        function toggleNewSearchFields() {
            const type = document.getElementById('new-search-type').value;
            const addrRow = document.getElementById('new-search-addr-row');
            if (addrRow) addrRow.style.display = (type === 'parking' || type === 'appartement') ? 'block' : 'none';
        }

        async function submitNewSearch(e) {
            e.preventDefault();
            const name = document.getElementById('new-search-name').value.trim();
            const type = document.getElementById('new-search-type').value;
            const budget = parseFloat(document.getElementById('new-search-budget').value) || 0;
            const address = document.getElementById('new-search-address').value.trim();
            const desc = document.getElementById('new-search-desc').value.trim();

            const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
            const newId = slug || ("search_" + Date.now());
            const dataFile = `data_${newId}.json`;

            const newProfile = {
                id: newId,
                name: name,
                type: type,
                icon: type === 'parking' ? 'fa-square-parking' : (type === 'appartement' ? 'fa-house' : 'fa-box'),
                badge: type === 'parking' ? 'Parking / Box' : (type === 'appartement' ? 'Appartement' : 'Objet'),
                enabled: true,
                data_file: dataFile,
                description: desc || name,
                params: {
                    budget_max: budget,
                    adresse_cible: address
                },
                sources: ["bienici"]
            };

            searchesConfig.searches.push(newProfile);

            if (isLocalServer) {
                try {
                    await fetch('/api/searches', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(searchesConfig)
                    });
                } catch (err) {}
            }

            closeNewSearchModal();
            document.getElementById('new-search-form').reset();
            showToast(`Recherche '${name}' créée avec succès !`, "success");
            switchSearchProfile(newId);
        }
    </script>
</body>
</html>
